<!DOCTYPE html>
<html>
<head>
  <title>JS Router (Single File)</title>
  <style>
    body {
      font-family: Arial;
      margin: 20px;
    }
    nav a {
      margin-right: 15px;
      color: blue;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" data-link>Home</a>
    <a href="/products" data-link>Products</a>
  </nav>

  <div id="app"></div>

  <script>
    // =========================
    // ROUTES (Real-world style)
    // =========================
    const routes = [
      { path: "/", view: Home },
      { path: "/products", view: Products },
      { path: "/product/:id", view: ProductDetails }
    ];

    // =========================
    // NAVIGATION HANDLER
    // =========================
    document.addEventListener("click", (e) => {
      if (e.target.matches("[data-link]")) {
        e.preventDefault();
        history.pushState(null, "", e.target.href);
        router();
      }
    });

    window.addEventListener("popstate", router);

    // =========================
    // ROUTER CORE
    // =========================
    function router() {
      const path = location.pathname;

      for (let route of routes) {
        const match = matchRoute(route.path, path);
        if (match) {
          document.getElementById("app").innerHTML =
            route.view(match.params);
          return;
        }
      }

      // 404 fallback
      document.getElementById("app").innerHTML = NotFound();
    }

    // =========================
    // DYNAMIC ROUTE MATCHING
    // =========================
    function matchRoute(routePath, currentPath) {
      const routeParts = routePath.split("/");
      const pathParts = currentPath.split("/");

      if (routeParts.length !== pathParts.length) return null;

      let params = {};

      for (let i = 0; i < routeParts.length; i++) {
        if (routeParts[i].startsWith(":")) {
          params[routeParts[i].slice(1)] = pathParts[i];
        } else if (routeParts[i] !== pathParts[i]) {
          return null;
        }
      }

      return { params };
    }

    // =========================
    // VIEWS (PAGES)
    // =========================

    function Home() {
      return `
        <h1>🏠 Home Page</h1>
        <p>Welcome to a real JS Router app</p>
      `;
    }

    function Products() {
      return `
        <h1>📦 Products</h1>
        <ul>
          <li><a href="/product/1" data-link>Product 1</a></li>
          <li><a href="/product/2" data-link>Product 2</a></li>
        </ul>
      `;
    }

    function ProductDetails(params) {
      return `
        <h1>🔍 Product Details</h1>
        <p>Product ID: ${params.id}</p>
        <a href="/products" data-link>⬅ Back</a>
      `;
    }

    function NotFound() {
      return `<h1>❌ 404 - Page Not Found</h1>`;
    }

    // =========================
    // INITIAL LOAD
    // =========================
    router();
  </script>

</body>
</html>
